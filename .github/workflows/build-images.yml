name: Build & publish images

# Собирает образы backend и frontend и публикует их в GitHub Container Registry
# (ghcr.io/dobriys/filament_tracker/backend и .../frontend).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

  # GitHub Release на каждый тег vX.Y.Z — после успешной сборки образов.
  # Заметки генерируются автоматически из коммитов, плюс блоки «Образы/Обновление».
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Derive version
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Filament Tracker ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## Образы

            ```
            ghcr.io/${{ github.repository }}/backend:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}/frontend:${{ steps.ver.outputs.version }}
            ```
            Также обновлены теги `${{ steps.ver.outputs.minor }}` и `latest`.

            ## Обновление

            ```bash
            docker compose pull
            docker compose up -d
            ```
