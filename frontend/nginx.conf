server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # Загрузки (gcode, бэкап-JSON, фото) идут через этот прокси — поднимаем лимит.
    client_max_body_size 100m;

    # API и health проксируем на backend — приложение живёт на одном порту (5173).
    # Резолвер + переменная = динамическое разрешение имени (переживает пересоздание
    # контейнера backend без 502).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ft_backend backend;
        proxy_pass http://$ft_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ft_backend backend;
        proxy_pass http://$ft_backend:8000;
    }

    # SPA: любые пути отдаём index.html (роутинг на клиенте)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # статика с хешем в имени — кэшируем надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    # runtime-конфиг не кэшируем
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
